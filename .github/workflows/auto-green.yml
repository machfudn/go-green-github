name: Auto Green

on:
  schedule:
    - cron: '5 0 * * *' # 00:05 UTC = 07:05 WIB, sekali sehari
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_USER: Machfudin
  GIT_EMAIL: 9060777+machfudn@users.noreply.github.com
  WEEKDAY_MIN: 5
  WEEKDAY_MAX: 10
  WEEKEND_MIN: 1
  WEEKEND_MAX: 3
  START_HOUR: 8
  END_HOUR: 17
  TZ: Asia/Jakarta

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set Git Identity
        run: |
          git config user.name "$GIT_USER"
          git config user.email "$GIT_EMAIL"

      - name: Random delay
        run: sleep $((RANDOM % 18000)) # 0-5 jam, waktu push jadi acak

      - name: Run commit script
        run: node dist/index.js
