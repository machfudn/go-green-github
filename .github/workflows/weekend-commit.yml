name: Weekend Commit

on:
  schedule:
    - cron: "0 6 * * 6" # Sabtu jam 6 pagi UTC
    - cron: "0 6 * * 0" # Minggu jam 6 pagi UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable ESM module type
        run: echo '{ "type": "module" }' > package.json

      - name: Install dependencies
        run: npm install jsonfile moment simple-git

      - name: Run commit script
        run: node weekend-commit.js

      - name: Set Git Identity
        run: |
          git config --global user.name "machfudin37"
          git config --global user.email "machfudin37@users.noreply.github.com"

      - name: Push commits
        run: |
          git add .
          git commit -m "Auto commit from GitHub Actions" || echo "Nothing to commit"
          git push
